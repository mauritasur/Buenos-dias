<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--p1:#ffe3ec;--p2:#ffc2d6;--p3:#f58fb0;--p4:#e0698f;--cream:#fffaf6;--ink:#6a4756;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(180deg,#ffeaf1 0%,#fff6f9 45%,#ffe9f0 100%);font-family:'Lora',Georgia,serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.95),rgba(255,255,255,0) 55%),radial-gradient(circle at 15% 90%,rgba(255,182,210,.35),transparent 40%),radial-gradient(circle at 90% 10%,rgba(255,200,222,.4),transparent 40%)}
.cloud{position:absolute;border-radius:50%;filter:blur(14px);opacity:.8;animation:drift 40s ease-in-out infinite alternate}
.cloud.w{background:#fff}.cloud.k{background:#ffd3e2}
@keyframes drift{to{transform:translateX(60px)}}
.h{position:absolute;bottom:-60px;animation:rise linear infinite;color:var(--c);opacity:0}
@keyframes rise{0%{transform:translateY(0) rotate(-8deg);opacity:0}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-115vh) rotate(10deg);opacity:0}}
.hs{position:absolute;color:var(--c);opacity:var(--o);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{opacity:calc(var(--o)*.35);transform:scale(.92)}}
.st{position:absolute;color:#fff;text-shadow:0 0 8px #ffb3cf,0 0 3px #f58fb0;animation:tw 4s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.95;transform:scale(1) rotate(20deg)}}
.cover,.book{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease,transform 1s ease}
.cover{gap:2.2vh;padding:12px;text-align:center}
.cover.gone{opacity:0;transform:scale(.9);pointer-events:none}
.to{font-family:'Dancing Script',cursive,serif;font-size:clamp(40px,8vh,64px);color:var(--p4);margin:0;text-shadow:0 2px 0 #fff,0 0 18px #fff}
.sub{margin:0;font-style:italic;font-size:clamp(14px,2.2vh,17px);color:var(--ink)}
.btn{font:600 clamp(15px,2.2vh,17px) 'Lora',serif;color:#fff;border:0;border-radius:40px;padding:14px 30px;cursor:pointer;background:linear-gradient(135deg,#ffa7c4,#f2799f);box-shadow:0 8px 22px rgba(240,120,160,.4),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .25s,box-shadow .25s;touch-action:manipulation}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 28px rgba(240,120,160,.5)}
.btn:active{transform:scale(.97)}
.env{position:relative;width:min(84vw,400px,calc(40vh*1.35));aspect-ratio:4/3;filter:drop-shadow(0 18px 24px rgba(220,110,150,.3));animation:bob 5s ease-in-out infinite}
.env.open{animation:none}
@keyframes bob{50%{transform:translateY(-8px)}}
.env>div,.env>svg{position:absolute}
.back{inset:0;border-radius:10px;background:linear-gradient(160deg,#ffcfe0,#ffb4cd)}
.paper{left:6%;right:6%;top:8%;height:80%;background:var(--cream);border-radius:6px;border:2px solid var(--p2);z-index:1;transition:transform 1.1s ease .9s;display:flex;align-items:center;justify-content:center;font-family:'Dancing Script',cursive;font-size:clamp(20px,4vh,30px);color:var(--p3)}
.env.open .paper{transform:translateY(-52%)}
.front{inset:0;z-index:3;border-radius:10px;background:linear-gradient(170deg,#fff,#ffe6ef);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.front2{inset:0;z-index:3;border-radius:10px;background:linear-gradient(200deg,#ffd9e6,#ffc6da);clip-path:polygon(0 0,50% 52%,0 100%,0 0)}
.flap{left:0;right:0;top:0;height:56%;z-index:4;transform-origin:top;background:linear-gradient(180deg,#ffd0e1,#ffe9f1);clip-path:polygon(0 0,100% 0,50% 100%);transition:transform 1s ease,z-index 0s linear .45s;border-radius:10px 10px 0 0}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{left:50%;top:44%;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:5;transition:opacity .5s;filter:drop-shadow(0 2px 3px rgba(200,80,120,.4))}
.env.open .seal{opacity:0}
.kitty{right:5%;bottom:6%;width:36%;z-index:6;filter:drop-shadow(0 4px 5px rgba(200,100,140,.35));transition:transform 1s ease,opacity 1s}
.env.open .kitty{transform:translateY(12px) scale(.9);opacity:.95}
.spark{position:fixed;z-index:5;pointer-events:none;color:var(--p3);animation:burst 1.9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(1.2) rotate(40deg);opacity:0}}
.book{opacity:0;pointer-events:none;transform:scale(.8) translateY(30px);transition:opacity 1.2s ease .3s,transform 1.2s ease .3s;gap:12px;display:block;overflow-y:auto;padding:70px 14px 40px}
.book.show{opacity:1;pointer-events:auto;transform:none}
.sheet{position:relative;width:min(92vw,560px);height:min(74vh,660px);background:linear-gradient(160deg,#fffdfb,#fff5f8);border:2px solid var(--p2);border-radius:14px;box-shadow:0 0 0 6px rgba(255,255,255,.7),0 0 0 7px var(--p2),0 22px 50px rgba(220,110,150,.28);perspective:1200px}
.sheet::before,.sheet::after{content:"♡";position:absolute;color:var(--p2);font-size:18px;line-height:1}
.sheet::before{top:8px;left:12px}.sheet::after{bottom:8px;right:12px}
.cr{position:absolute;color:var(--p2);font-size:16px;line-height:1}
.pg{position:absolute;inset:0;padding:34px clamp(22px,6vw,48px);overflow-y:auto;font-size:clamp(16px,2.4vh + 2px,18px);line-height:1.7;transition:opacity .3s,transform .3s;scrollbar-width:thin;scrollbar-color:var(--p2) transparent}
.pg.out{opacity:0;transform:rotateY(-14deg) translateX(-14px)}
.pg p{margin:0 0 1em;text-align:left;hyphens:manual}
.pg p.t{font-family:'Dancing Script',cursive,serif;font-size:1.5em;color:var(--p4);line-height:1.2}
.pg p.sg{font-family:'Dancing Script',cursive,serif;font-size:1.45em;color:var(--p4);margin:.2em 0}
.measure{visibility:hidden;pointer-events:none;overflow:hidden}
.ctl{display:flex;align-items:center;gap:14px;font-size:14px}
.nb{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--p2);background:rgba(255,255,255,.85);color:var(--p4);font-size:20px;cursor:pointer;transition:.25s;touch-action:manipulation}
.nb:hover:not(:disabled){background:var(--p2);color:#fff;transform:scale(1.08)}
.nb:disabled{opacity:.35;cursor:default}
.cnt{min-width:64px;text-align:center}
.back-btn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:6;background:rgba(255,255,255,.8);border:1.5px solid var(--p2);color:var(--p4);border-radius:30px;padding:8px 14px;font:14px 'Lora',serif;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s 1s}
.book.show~.back-btn{opacity:1;pointer-events:auto}
.sky::after{content:"";position:absolute;inset:-20%;background:conic-gradient(from 190deg at 50% -8%,transparent 0,rgba(255,255,255,.55) 8%,transparent 17%,rgba(255,215,232,.45) 30%,transparent 40%,rgba(255,255,255,.4) 52%,transparent 60%);animation:rays 30s ease-in-out infinite alternate}
@keyframes rays{to{transform:rotate(6deg) scale(1.05)}}
.btn{position:relative;overflow:hidden}.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.env .kitty{right:7%;bottom:9%;width:25%;height:auto;z-index:6}
.env .back{box-shadow:inset 0 0 0 3px rgba(255,255,255,.75),inset 0 -14px 24px rgba(240,140,175,.25)}
.env .front{background:linear-gradient(to top right,transparent 49.5%,rgba(240,140,175,.4) 50%,transparent 50.8%),linear-gradient(to top left,transparent 49.5%,rgba(240,140,175,.4) 50%,transparent 50.8%),radial-gradient(circle at 20% 90%,rgba(255,255,255,.9) 0 2px,transparent 3px),radial-gradient(circle at 82% 78%,rgba(255,255,255,.9) 0 2px,transparent 3px),linear-gradient(170deg,#fffdfb,#ffe3ed 70%,#ffd3e2)}
.env .flap{background:linear-gradient(165deg,#fff4f8,#ffc9dc 85%);box-shadow:inset 0 -6px 12px rgba(240,140,175,.35)}
.env .flap::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.7) 0,transparent 35%)}
.book{scrollbar-width:thin;scrollbar-color:var(--p2) transparent}
.sheet{display:flex;width:min(96vw,1180px);height:auto;min-height:60vh;margin:0 auto;background:linear-gradient(90deg,#fff8f3,#fffdfb 47%,#fff0f4 50%,#fffdfb 53%,#fff8f3);border-radius:10px}
.sheet .pg{position:relative;inset:auto;flex:1;min-width:0;overflow:visible;padding:50px clamp(28px,4vw,58px);font-size:17.5px;line-height:1.75;animation:pgin 1s ease both}
.sheet .pg p{margin:0 0 1.15em}.sheet .pg p.t{font-size:1.9em;text-align:center;margin-bottom:.8em}
.sheet .pg+.spine+.pg{animation-delay:.25s}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}}
.spine{width:2px;margin:20px 0;background:linear-gradient(transparent,var(--p2),transparent);box-shadow:-12px 0 20px -6px rgba(240,140,175,.22),12px 0 20px -6px rgba(240,140,175,.22)}
.sheet.single{width:min(94vw,620px)}.sheet.single .spine{display:none}
.ctl{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:6;background:rgba(255,255,255,.88);padding:6px 14px;border-radius:40px;box-shadow:0 6px 18px rgba(240,120,160,.3)}
@media(max-width:859px){.sheet .pg{padding:38px 22px 46px;font-size:17px}.book{padding-bottom:96px}}
.more{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--p4);background:rgba(255,255,255,.88);padding:6px 16px 3px;border-radius:20px;box-shadow:0 4px 14px rgba(240,120,160,.28);opacity:0;pointer-events:none;transition:opacity .4s}
.more.on{opacity:1}.more b{font-size:20px;line-height:.9;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
@media(min-width:860px){.more{bottom:22px}}
.more{background:none;box-shadow:none;padding:0;bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.more.on{opacity:.6}.more b{font-size:28px;color:var(--p3);text-shadow:0 0 6px #fff,0 0 3px #fff,0 0 10px #fff}
.h svg,.hs svg,.spark svg{display:block}.h,.hs,.spark{line-height:1}
.sheet .spine{width:0;margin:0;background:none;box-shadow:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

<template id="src">
<p class="t">Buenos días, mi niña.</p>
<p>Espero que hayas dormido bien y que hoy tengas un día muy bonito, que todo te salga bien y que no tengas tantos dolores de cabeza con las cositas que tengas que hacer JAJAJAJA. Le pido a Dios que te cuide muchísimo, que siempre te acompañe, que te proteja de todo lo malo y que te permita estar bien, tranquila y feliz. Ojalá hoy te pasen cositas bonitas, que te rías mucho y que encuentres algún motivo para sonreír incluso si el día no empieza como esperabas.</p>
<p>De verdad deseo que te vaya muy bien en todo, Salo. Que puedas ir consiguiendo las cositas que quieres, que te sientas orgullosa de ti misma y que nunca te falten motivos para seguir adelante. Quiero que estés bien, que tengas tranquilidad y que, incluso en esos días en los que estés cansada o no tengas tantas ganas de nada, encuentres algo que te haga sentir mejor. Tú también mereces días bonitos, de esos en los que puedes olvidarte un ratico de las preocupaciones y simplemente disfrutar.</p>
<p>La verdad, no sé si sea el mejor momento para ponerme a decirte tantas cosas bonitas JAJAJAJA, y espero que no te incomode leer todo esto. No quiero que sientas que tienes que responderme de alguna manera ni nada por el estilo. Simplemente, me dieron ganas de escribirte y decirte algunas cositas que llevo dentro. A veces pienso tanto las cosas antes de decirlas que termino quedándome callada, o me enredo intentando explicar algo que en mi cabeza parecía mucho más fácil. Pero bueno, hoy quise sentarme a escribirte con calma, porque también tengo muchas cosas bonitas que quisiera decirte y no quiero guardármelas todas.</p>
<p>Hay muchas cositas tuyas que me encantan, Salo, y algunas son tan sencillas que quizás ni te imaginas cuánto me gustan. Por ejemplo, tus chistes, hasta los más tontos JAJAJAJAJA. Mujer, tú a veces sales con unas cosas que me dan una risa y después me quedo pensando en lo boba que soy por reírme tanto. Y también me da mucha ternura cuando me mandas fotos random, así de la nada, porque son esas pequeñas cositas tuyas las que me sacan una sonrisa. Me gusta que compartas conmigo esas bobaditas de tu día, incluso cuando quizás para ti no sean nada del otro mundo.</p>
<p>Me encanta escucharte, escuchar tu voz y verte esos ojitos tan hermosos que tienes. No sé si te haces una idea de lo mucho que me gusta mirarte, porque es que hasta detrás de una pantalla consigues ponerme nerviosa, imagínate JAJAJAJA. A veces quisiera explicarte todas esas cositas que me haces sentir, pero termino enredándome con las palabras y no digo ni la mitad de lo que quería decir. Y tú ahí, tan tú, sin saber todo lo que puedes provocar en mí con cosas tan sencillas.</p>
<p>También me gusta saber de ti, que me cuentes tus cosas, escucharte hablar de lo que te pasa y conocer esos pequeños detalles de tu vida. Me gusta cuando puedo compartir contigo una conversación, cuando nos reímos por alguna bobadita y cuando un momento cualquiera termina convirtiéndose en un recuerdo bonito. Son cosas sencillas, sí, pero para mí tienen un valor especial porque las comparto contigo.</p>
<p>Y es que, Salo, para mí tú no eres cualquier persona. Hay algo muy especial en ti y en la forma en la que te has ido haciendo importante para mí. A veces basta con acordarme de algo que dijiste, de alguna conversación o de una bobadita tuya para que me encuentre sonriendo sola como una boba JAJAJAJA. Y creo que eso es de las cosas más bonitas: que alguien pueda aparecer en tus pensamientos de esa manera, sin hacer nada extraordinario, simplemente porque hay algo de esa persona que te hace feliz.</p>
<p>Si supieras la ternura que me dan algunas cosas tuyas, mujer. Hay detalles que quizás tú haces sin pensarlo, pero que a mí se me quedan guardados. Y no hablo solamente de las cosas bonitas que puedes decirme, sino también de tu manera de ser, de tus ocurrencias y de esas pequeñas cosas que te hacen ser tú. Me gusta poder conocer esas partes tuyas y tener mis propios motivos para sonreír cuando pienso en ti.</p>
<p>Y hay otras cositas que extraño mucho, aunque a veces no sepa cómo decirlas sin ponerme toda nerviosa. Extraño abrazarte, sentirte cerquita de mí, darte besitos y poder disfrutar de esos momenticos en los que no hace falta hacer nada extraordinario, sino simplemente estar juntas. Porque sí, me gusta escucharte y verte por una pantalla, pero tenerte cerca es diferente. Poder abrazarte y sentirte conmigo es de esas cosas que guardo con muchísimo cariño y que, de verdad, extraño.</p>
<p>Quizás por eso también me emocionan tanto los momentos que puedo compartir contigo. Porque no se trata solamente de hacer planes o de tener algo que contar después, sino de todas esas cositas que se sienten bonitas cuando estoy contigo. A veces pienso en esos momentos y me da una mezcla de ternura, ilusión y nervios que ni yo misma sé explicar JAJAJAJA. Pero son sentimientos que me nacen y que quería compartir contigo, porque forman parte de lo que significas para mí.</p>
<p>También quisiera que tú misma pudieras ver todas las cosas bonitas que hay en ti. Que no seas tan dura contigo cuando algo no te salga como querías, que no sientas que tienes que poder con todo y que también te des tus momenticos para descansar y hacer las cosas que te gustan. Quiero que estés bien contigo misma, que puedas reírte mucho, que disfrutes las cosas bonitas que te pasan y que, cuando tengas un día difícil, recuerdes que no todos los días tienen que salir perfectos.</p>
<p>Yo quiero que te pasen muchas cosas bonitas, mi niña. Que estés sana, que tengas tranquilidad y que puedas disfrutar de las cosas que te hacen feliz. Que Dios te cuide muchísimo, que te ayude cuando tengas la cabecita llena de cosas, que te dé fuerzas cuando estés cansada y que te acompañe en cada pasito que des. Siempre voy a desear que estés bien, que te vaya bonito y que nunca te falten motivos para sonreír.</p>
<p>No sé si siempre te hago saber todo esto de la mejor manera, pero me gusta poder decirte estas cosas. Me gusta recordarte que eres importante para mí, que me importan tus días, cómo te sientes y las cositas que te pasan. A veces quisiera que pudieras entender todo lo que quiero decirte sin que yo tuviera que pasar tanto tiempo pensando cómo explicártelo JAJAJAJA. Pero bueno, aquí estoy, intentando hacerlo lo mejor que puedo y diciéndote estas cositas porque me nacen de verdad.</p>
<p>Esta carta ya estaba prácticamente preparada para hoy, pero después de lo que pasó anoche quise añadirle algo más. Me quedé pensando en que quizás no te expliqué bien lo que quería decirte y no quisiera que te quedaras con una idea equivocada de lo que siento.</p>
<p>Tú sabes que me pongo nerviosa cuando voy a verte, mujer jajaja. Y eso no es de ahora, porque hasta detrás de una pantalla me has puesto nerviosa, imagínate en persona. Pero una cosa es ponerme nerviosa y otra muy distinta es no querer verte. Yo tengo muchísimas ganas de compartir ese momentico contigo y de verdad me emociona pensar en ello. Solo que, al mismo tiempo, me dan esos nervios que a veces ni yo misma sé cómo explicar.</p>
<p>Creo que también me pasa porque tú me importas mucho y porque, cuando se trata de ti, siento tantas cosas que a veces termino enredándome con mis propias palabras. Me emociono, me pongo nerviosa, pienso demasiado y después digo algo que no expresa realmente lo que quería decir. Y bueno, anoche creo que me pasó un poquito eso.</p>
<p>No te cuento esto para volver a lo que pasó ni para hacerte sentir mal. Simplemente quería explicártelo mejor, porque no quiero que confundas mis nervios con falta de ganas. Al contrario, me hace mucha ilusión. Quizás no siempre sepa expresarlo de la mejor manera, pero eso no quita las ganas que tengo ni lo bonito que me parece la idea de compartir momentos contigo.</p>
<p>Y bueno, mi niña, creo que ya me extendí bastante JAJAJAJAJA. Yo solamente quería escribirte algo bonito, decirte algunas cositas que me nacen y recordarte lo especial que eres para mí. No sé si logré expresar todo como quería, porque tú sabes que a veces tengo tantas cosas en la cabeza que ni sé cómo acomodarlas, pero al menos aquí están, escritas con mucho cariño y con todas las ganas de que puedas recibirlas de la manera más bonita.</p>
<p>Espero que hoy tengas un día precioso, mi flaquita. Que Dios te cuide muchísimo, que te acompañe siempre y que te regale muchas cositas bonitas. Cuídate mucho, come bien, descansa y no te me estreses tanto, ¿sí? JAJAJAJA. Te deseo todo lo bonito que pueda desearte y espero que hoy tengas muchos motivos para sonreír.</p>
<p class="sg">Te amo demasiado,</p>
<p class="sg">M</p>
